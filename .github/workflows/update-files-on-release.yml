name: Update Files on Release


on:
  push:
    branches:
      - master

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install jq
        run: sudo apt-get install jq

      - name: Update sep.json
        run: |
          echo "Updating sep.json version"
          version=$(jq -r '.version' sep.json)
          new_version=$(echo $version | awk -F. -v OFS=. '{$NF++;print}')
          jq --arg new_version "$new_version" '.version = $new_version' sep.json > temp.json && mv temp.json sep.json
          jq --arg new_date "$(date +%d.%m.%Y)" '.date = $new_date' sep.json > temp.json && mv temp.json sep.json
          
            # Обновление версии четвертого элемента в массиве microservices
          element_version=$(jq -r '.microservices[3].version' sep.json)
          if [[ -n "$element_version" ]]; then
            new_element_version=$(echo "$element_version" | awk -F. -v OFS=. '{$NF++;print}')
            jq --arg new_version "$new_element_version" '.microservices[3].version = $new_version' sep.json > temp.json && mv temp.json sep.json
            echo "Updated third microservice to version $new_element_version"
          else
            echo "The third microservice version is not set. Skipping update."
          fi
          
          
          echo $new_version > version.txt

      - name: Update release notes
        run: |
          # Получение сообщения последнего коммита
          commit_message=$(git log -1 --pretty=%B)

          # Определение следующего номера записи
          if [[ -f release_notes.txt ]]; then
            # Извлечение всех номеров записей и определение следующего
            last_number=$(grep -o '^[0-9]\+' release_notes.txt | sort -n | tail -n 1)
            if [[ -z "$last_number" ]]; then
              next_number=1
            else
              next_number=$((last_number + 1))
            fi
          else
            next_number=1
          fi

          # Формирование новой записи
          new_entry="$next_number. $commit_message"

          # Создание временного файла с обновленными записями
          temp_file=$(mktemp)

          # Добавление новой записи в файл
          if [[ -f release_notes.txt ]]; then
            # Копируем существующие записи в новый файл
            cat release_notes.txt > "$temp_file"
          fi

          # Записываем новую запись
          echo "$new_entry" >> "$temp_file"

          # Перемещаем временный файл обратно в основной файл
          mv "$temp_file" release_notes.txt
      

      - name: Commit and push changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          set -x
          git config --global user.name "Petr Gurin"
          git config --global user.email "$GIT_EMAIL"
          git add sep.json release_notes.txt
          new_version=$(cat version.txt)
          git commit -m "Update sep.json and release_notes.txt to version $new_version" || { echo "No changes to commit"; exit 0; }
          echo "Token: $PAT_TOKEN"
          echo "Email: $GIT_EMAIL"
          echo "Attempting to push changes..."
          git push https://x-access-token:$PAT_TOKEN@github.com/androkc/joint.git || { echo "Git push failed"; exit 1; }
          echo "Git push succeeded"



